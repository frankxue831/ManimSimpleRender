[tool.black]
line-length = 100
# Pin the lowest supported interpreter so formatting is deterministic and black's
# AST safety-check passes when run under 3.12 (auto-detect would also target 3.13).
target-version = ["py312"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manim-simple-render"
version = "0.1.0"
description = "Explainer Engine (source-citing storyboard YAML to narrated Manim video) and a PyQt5 GUI for batch-rendering Manim scenes."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
# No base dependencies: each entry point pulls only what it needs, so the light
# `verify` path never builds manim/pycairo (which need cairo system headers).
dependencies = []

[project.optional-dependencies]
dev = ["black==26.5.1", "flake8==7.3.0"]
# `explainer verify` (citation gate + codegen check) only parses YAML and reads
# files; it never imports manim, so this extra installs no render stack.
verify = ["PyYAML>=6"]
# The Explainer Engine render path: storyboard YAML + cited code -> narrated
# animated video. manim needs cairo/pango (+ ffmpeg, LaTeX) on the system.
# manim 0.20.x needs numpy 2.x, and numpy 2.1+ ships cp312/cp313 wheels.
# manim-voiceover adds audio-led narration. 0.4.0 dropped pkg_resources (so the
# old setuptools<81 pin is gone) and requires the symlink-safe
# python-dotenv>=1.2.2 (PYSEC-2026-2270); it stores cache_dir as str, which
# tts_compat handles for both versions.
explainer = [
    "PyYAML>=6",
    "manim==0.20.1",
    "numpy>=2.1,<3",
    "manim-voiceover[gtts]==0.4.0",
]
# The PyQt5 desktop GUI (manim-simple-render) renders through the manim CLI.
# The manim + numpy pins repeat the ones in `explainer` on purpose: keep the two
# lists in step (a self-referencing extra would make the install depend on how
# each pip version resolves it).
gui = ["PyQt5==5.15.11", "manim==0.20.1", "numpy>=2.1,<3"]
# The LLM planner (explainer/plan/) drafts a storyboard from real code. Kept
# out of the `explainer` extra so `verify` and `render` stay dependency-free;
# explainer/plan/client.py imports the SDK lazily so an uninstalled extra is a
# clear error message rather than an ImportError at CLI start.
planner = ["anthropic>=0.70"]

[project.gui-scripts]
manim-simple-render = "app.bootstrap:main"

[project.scripts]
explainer = "explainer.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "explainer*"]
namespaces = false

[tool.setuptools.package-data]
"app.config" = ["config.v2.json"]
"app.ui" = ["theme.qss"]

[tool.pytest.ini_options]
# CI runs `python -m unittest discover -s tests`; this keeps pytest on the same
# tree. examples/scenes/test_debugging_workflow*.py are Manim demo scenes, not
# tests, and must never be collected.
testpaths = ["tests"]
norecursedirs = ["examples", ".git", "build", "dist", "*.egg-info"]
