name: Nightly (real render)

# Tier B of the automation harness: install the FULL render toolchain (manim +
# ffmpeg + cairo/pango + PyQt5) and run every e2e tier, including the real-render
# smoke that the per-PR CI skips. Scheduled nightly + manually dispatchable.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  real-render-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries (render toolchain + Qt offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install the full stack (manim + PyQt5 + numpy)
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[gui]"

      # With manim + ffmpeg + PyQt5 present, every gate opens: Tier A pipeline,
      # Tier C GUI, and Tier B real-render smoke all run for real.
      - name: All e2e tiers (incl. real render)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests/e2e -t .
