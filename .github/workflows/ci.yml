name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt offscreen system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      # The test suite imports PyQt5 + PyYAML but NOT manim: the app services are
      # Qt-free, and the explainer tests are manim-free except the code_compat
      # accessor check, which skips when manim is absent. So manim + its heavy
      # system deps stay out of this fast job.
      - name: Install Python dependencies (Qt + YAML + lint tools)
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt5==5.15.11 "PyYAML>=6" black==26.5.1 flake8==7.3.0

      - name: black --check
        run: black --check app explainer scene_production tests main.py examples/scenes/netty_eventloop.py examples/scenes/tcp_stream.py examples/scenes/scene_font.py examples/scenes/revision_flow.py examples/revisions/run_flow.py examples/silent_review

      - name: flake8
        run: flake8 app explainer scene_production tests main.py examples/scenes/netty_eventloop.py examples/scenes/tcp_stream.py examples/scenes/scene_font.py examples/scenes/revision_flow.py examples/revisions/run_flow.py examples/silent_review

      - name: Unit tests (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests

  # Tier A pure-pipeline e2e (automation harness Phase 1): drives discovery ->
  # jobs -> command -> the real RenderRunner against a fake `manim` shim. Qt-free
  # AND manim-free by design, so it installs NOTHING and proves the pipeline on a
  # bare interpreter.
  e2e-pure:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Tier A e2e (no PyQt5, no manim -- Qt/manim cases skip)
        run: python -m unittest discover -s tests/e2e -t .

  # The README quick start, as written, on a clean runner: the light `.[verify]`
  # install (PyYAML only -- must not need cairo headers), `explainer verify`, then
  # the documented apt prerequisites + the full `.[explainer]` install and small
  # real compatibility renders. Voiceover uses local audio, without network TTS.
  readme-quickstart:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Light install + verify (README quick start)
        run: |
          python -m venv .venv && source .venv/bin/activate
          pip install -e ".[verify]"
          python -c "import importlib.util as u; assert u.find_spec('manim') is None, 'verify extra pulled manim'"
          explainer verify examples/evidence-budget.story.yaml
          explainer verify examples/citation-gate.story.yaml

      - name: Render prerequisites (README apt line)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3-dev libcairo2-dev libpango1.0-dev ffmpeg texlive texlive-latex-extra

      - name: Full explainer install (README quick start, no render)
        run: |
          source .venv/bin/activate
          pip install -e ".[explainer]"
          python -c "import manim, manim_voiceover; print('manim', manim.__version__)"
          explainer verify examples/evidence-budget.story.yaml

      - name: Real-Manim compatibility (code, video, voiceover, frame tracing)
        run: |
          source .venv/bin/activate
          python -m unittest tests.explainer_tests.test_code_compat tests.e2e.test_real_render_smoke tests.test_frame_capture_process

      - name: Traced silent revision and review example
        run: |
          source .venv/bin/activate
          python -m examples.silent_review.run --output-dir "$RUNNER_TEMP/silent-review-example"
          python -c '
          import json, os, shutil
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "silent-review-example"
          result = json.loads((root / "example-result.json").read_text())
          previous = json.loads((root / "comparison-previous.json").read_text())
          current = json.loads((root / "comparison-candidate.json").read_text())
          assert result["audit_status"] == "unchanged_non_target"
          assert previous["assessment_current"] is False
          assert previous["candidate_requires_fresh_assessment"] is True
          assert current["assessment_current"] is True
          assert current["decision"] == "needs_review"
          assert current["readiness"] == "not_determined"
          evidence = Path(os.environ["RUNNER_TEMP"]) / "silent-review-evidence"
          evidence.mkdir()
          for name in ("example-result.json", "audit.json", "comparison-previous.json", "comparison-candidate.json"):
              shutil.copy2(root / name, evidence / name)
          for name in ("baseline", "candidate"):
              capture = root / (name + ".stdout.jsonl")
              shutil.copy2(capture, evidence / capture.name)
              shutil.copy2(root / (name + ".completion.json"), evidence)
              terminal = json.loads(capture.read_text().splitlines()[-1])
              retained = evidence / name
              retained.mkdir()
              for key, entry in terminal["artifacts"].items():
                  source = Path(entry["path"])
                  shutil.copy2(source, retained / (key + source.suffix))
          '

      - name: Retain public fixture evidence
        uses: actions/upload-artifact@v4
        with:
          name: silent-review-evidence-${{ matrix.python-version }}
          path: ${{ runner.temp }}/silent-review-evidence/
          if-no-files-found: error
          retention-days: 7

  test-windows-render-supervision:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Windows render process supervision (no application dependencies)
        run: python -m unittest tests.test_runner

  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Verify the package builds + installs and ships its data files + entry
      # point, WITHOUT pulling the heavy runtime deps (PyQt5/manim): the verified
      # imports (config loader + theme) are Qt-free. Protects the packaging work.
      - name: Install package (no deps)
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps .

      - name: Verify packaging (data files + entry point)
        run: |
          cd "${RUNNER_TEMP}"   # import the INSTALLED package, not the source tree
          python -c "
          from app.config.loader import load_config
          from app.ui.theme import load_stylesheet
          assert load_config().engines, 'config.v2.json did not ship'
          assert load_stylesheet().strip(), 'theme.qss did not ship'
          from importlib.metadata import entry_points
          names = {ep.name for ep in entry_points(group='gui_scripts')}
          assert 'manim-simple-render' in names, names
          print('packaging smoke OK:', sorted(names))
          "
